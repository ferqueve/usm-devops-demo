# GitGuardian configuration for UTEC Space Manager
# Ignora secretos de testing que NO se usan en producción

version: 2

# Excluir archivos y directorios de test del escaneo
paths-ignore:
  - "**/src/test/**"
  - "**/*test*.properties"
  - "**/application-test.properties"
  - "**/TestSecurityConfig.java"
  - "**/*.test.ts"
  - "**/*.spec.ts"

# Configuración del motor de secretos
secrets-engine-version: 2

# Patrones específicos a ignorar
matches-ignore:
  - name: JWT test secret (dummy)
    match: ZHVtbXktdGVzdC1zZWNyZXQtZHVtbXktdGVzdC0zMmM=
  - name: Test email credentials
    match: test@utec.edu.uy

