sonar.projectKey=USM-frontend
sonar.projectName=USM-frontend

# Lo que se analiza
sonar.sources=src
sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,public/**,**/*.config.js,**/*.config.ts

# Idioma principal
sonar.sourceEncoding=UTF-8

# Cobertura (cuando se sumen tests con vitest, el reporte va a este path)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
