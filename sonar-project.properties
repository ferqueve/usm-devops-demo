sonar.projectKey=USM
sonar.projectName=USM Space Manager

# Monorepo: Java backend + TypeScript frontend
sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test

# Java backend
sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# TypeScript frontend
sonar.typescript.tsconfigPath=frontend/tsconfig.json
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusiones
# Email templates: las reglas Web:* (layout tables, cellpadding, role="presentation")
# son inaplicables a HTML de email — Outlook/Gmail no soportan CSS moderno y exigen
# layout tables y atributos HTML "deprecados" para renderizar correctamente.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/target/**,**/coverage/**,**/*.config.js,**/*.config.ts,**/*.config.mjs,backend/src/main/resources/templates/email/**

sonar.sourceEncoding=UTF-8
