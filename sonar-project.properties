sonar.projectKey=USM
sonar.projectName=USM Space Manager

# Sólo el backend Java. El frontend y los servicios Python quedan fuera del
# análisis a propósito: se verifican en ci.yml (lint, tipos, tests, build), que
# es la puerta que bloquea.
sonar.sources=backend/src/main
sonar.tests=backend/src/test

sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Plantillas de email: las reglas Web:* (layout tables, cellpadding,
# role="presentation") son inaplicables al HTML de email — Outlook y Gmail no
# soportan CSS moderno y exigen justamente esas tablas y atributos "deprecados".
sonar.exclusions=**/target/**,backend/src/main/resources/templates/email/**

sonar.sourceEncoding=UTF-8
