sonar.projectKey=USM
sonar.projectName=USM Space Manager

# Sólo el backend Java. El frontend y los servicios Python quedan fuera del
# análisis a propósito: se verifican en ci.yml (lint, tipos, tests, build), que
# es la puerta que bloquea.
sonar.sources=backend/src/main
sonar.tests=backend/src/test

sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# Plantillas de email: las reglas Web:* (layout tables, cellpadding,
# role="presentation") son inaplicables al HTML de email — Outlook y Gmail no
# soportan CSS moderno y exigen justamente esas tablas y atributos "deprecados".
sonar.exclusions=**/target/**,backend/src/main/resources/templates/email/**

sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# S8692 ("el reloj del sistema no debería usarse en tests") queda desactivada
# para el código de test. Los 110 casos del proyecto son fixtures del tipo
# `Instant.now().plus(1, DAYS)`: siempre futuras respecto del reloj real, así que
# no introducen intermitencia, que es lo que la regla busca evitar. Fijarlas a
# una fecha concreta las volvería pasado y rompería las validaciones de los
# servicios, que sí usan el reloj real. Hacerlo correctamente implica inyectar un
# Clock en una veintena de servicios: es una mejora legítima, pero es un refactor
# grande para una regla de severidad informativa. Si algún día se inyecta el
# Clock, borrar estas cuatro líneas.
sonar.issue.ignore.multicriteria=s8692tests
sonar.issue.ignore.multicriteria.s8692tests.ruleKey=java:S8692
sonar.issue.ignore.multicriteria.s8692tests.resourceKey=**/src/test/**
