# Configuración de pruebas para UTEC Space Manager

# Base de datos en memoria H2 para tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS TEXT
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Liquibase deshabilitado para tests
spring.liquibase.enabled=false

# JWT - Claves de test (SOLO PARA TESTING - NO USAR EN PRODUCCIÓN)
# gitguardian:ignore
# Secreto de prueba aleatorio (para testing GitGuardian)
# NUNCA usar este valor en producción - En producción usar variable de entorno
jwt.secret=dTNzdC1zM2NyM3Qta2V5LWYwci11dGVjLXNwYWNlLW1hbmFnZXItdDNzdGluZy1vbmx5LW0xbi0zMi1jaGFycy1yNG5kMG0=
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# Email - Deshabilitado para tests
gmail.api.client-id=test-client-id
gmail.api.client-secret=test-client-secret
gmail.api.refresh-token=test-refresh-token
gmail.api.from-email=test@test.com

# Frontend y Backend URLs de prueba
app.frontend.url=http://localhost:5173
app.backend.url=http://localhost:8080

# Reservas - Recordatorios
app.reservas.reminder.hours-before=24
app.reservas.reminder.enabled=false

# Zona horaria
app.timezone=America/Montevideo

# OAuth2 - Google (valores de prueba)
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/api/v1/oauth2/google/callback

# MinIO - Configuración de prueba
minio.endpoint=http://localhost:9000
minio.public-url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=espacios-test
minio.region=us-east-1
minio.max-file-size=52428800
minio.allowed-mime-types=image/jpeg,image/jpg,image/png,image/webp,image/gif

# Redis - Configuración de prueba (usar Redis embebido o mock)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=2000ms

# Cache - Deshabilitado para tests o usar valores cortos
spring.cache.type=none
cache.usuarioStats.ttl=1000
cache.inventarioStatistics.ttl=1000
cache.espacios.ttl=1000
cache.reservas.ttl=1000

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# SpringDoc
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Logging
logging.level.com.utec.backend=DEBUG
logging.level.org.springframework.security=DEBUG

