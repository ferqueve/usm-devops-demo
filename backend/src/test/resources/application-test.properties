# Configuración de pruebas para UTEC Space Manager

# Base de datos en memoria H2 para tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Liquibase deshabilitado para tests
spring.liquibase.enabled=false

# JWT - Claves de test (SOLO PARA TESTING - NO USAR EN PRODUCCIÓN)
# gitguardian:ignore
# Secreto de prueba aleatorio (para testing GitGuardian)
# NUNCA usar este valor en producción - En producción usar variable de entorno
jwt.secret=dTNzdC1zM2NyM3Qta2V5LWYwci11dGVjLXNwYWNlLW1hbmFnZXItdDNzdGluZy1vbmx5LW0xbi0zMi1jaGFycy1yNG5kMG0=
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# Email - Deshabilitado para tests
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@utec.edu.uy
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Logging
logging.level.com.utec.backend=DEBUG
logging.level.org.springframework.security=DEBUG

