<div style="color: #333333; font-size: 16px; line-height: 1.6;">
    <h2 style="margin: 0 0 20px; color: #212529; font-size: 24px; font-weight: 600;">
        {{tituloEstado}}
    </h2>
    
    <p style="margin: 0 0 20px;">
        Hola <strong>{{nombreUsuario}}</strong>,
    </p>
    
    <p style="margin: 0 0 20px;">
        {{mensaje}}
    </p>
    
    <div style="margin: 30px 0; padding: 20px; background-color: {{colorFondo}}; border-radius: 6px; border-left: 4px solid {{colorBorde}};">
        <h3 style="margin: 0 0 15px; color: #212529; font-size: 18px; font-weight: 600;">
            Estado de la cuenta
        </h3>
        <p style="margin: 0; color: #212529; font-size: 16px; font-weight: 600;">
            {{accion}}
        </p>
    </div>
    
    <div style="margin: 30px 0; padding: 15px; background-color: {{colorMensajeFondo}}; border-left: 4px solid {{colorMensajeBorde}}; border-radius: 4px;">
        <p style="margin: 0; color: {{colorMensajeTexto}}; font-size: 14px;">
            {{mensajeAdicional}}
        </p>
    </div>
    
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 30px 0;">
        <tr>
            <td align="center" style="background-color: #184897; border-radius: 6px;">
                <a href="{{frontendUrl}}" style="display: inline-block; padding: 14px 32px; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 16px; border-radius: 6px;">
                    Acceder al sistema
                </a>
            </td>
        </tr>
    </table>
    
    <p style="margin: 30px 0 0; color: #6c757d; font-size: 14px;">
        Saludos,<br>
        <strong>Equipo UTEC Space Manager</strong>
    </p>
</div>
