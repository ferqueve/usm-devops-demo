# ===== CONFIGURACIÓN E2E =====
# Perfil dedicado a las pruebas extremo a extremo con Playwright.
# Postgres real (vía docker-compose.e2e.yml), Liquibase activo,
# Redis/MinIO/Gmail apagados o stub.

# ===== BASE DE DATOS =====
spring.datasource.url=${E2E_DB_URL:jdbc:postgresql://localhost:5433/utec_e2e}
spring.datasource.username=${E2E_DB_USER:utec_e2e}
spring.datasource.password=${E2E_DB_PASSWORD:utec_e2e}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA: validate (Liquibase construye el schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase activo — se ejercitan los changesets reales
spring.liquibase.enabled=true

# ===== CACHE / REDIS =====
# Redis se levanta en docker-compose.e2e.yml en el puerto 6380.
# El cache se mantiene apagado: las pruebas E2E necesitan datos siempre frescos.
spring.cache.type=none
# Permitir que E2ECacheConfig sobreescriba el cacheManager Redis-backed.
spring.main.allow-bean-definition-overriding=true
spring.data.redis.host=${E2E_REDIS_HOST:localhost}
spring.data.redis.port=${E2E_REDIS_PORT:6380}

# ===== JWT (clave fija de prueba) =====
jwt.secret=ZTJlLXNlY3JldC1rZXktZm9yLXVzbS11dGVjLXBsYXl3cmlnaHQtdGVzdGluZy1taW4tMzItY2hhcnM=
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# ===== EMAIL DESHABILITADO =====
gmail.api.enabled=false
gmail.api.client-id=disabled
gmail.api.client-secret=disabled
gmail.api.refresh-token=disabled
gmail.api.from-email=e2e@usm.local

# ===== MINIO DESHABILITADO =====
# FileStorageService acepta MinioClient nulo y se desactiva en consecuencia.
minio.enabled=false
minio.endpoint=http://localhost:9000
minio.public-url=http://localhost:9000
minio.access-key=disabled
minio.secret-key=disabled
minio.bucket-name=e2e-bucket
minio.region=us-east-1
minio.max-file-size=52428800
minio.allowed-mime-types=image/jpeg,image/png,image/webp

# ===== OAUTH2 GOOGLE (no se ejercita en E2E) =====
spring.security.oauth2.client.registration.google.client-id=disabled
spring.security.oauth2.client.registration.google.client-secret=disabled
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/api/v1/oauth2/google/callback

# ===== URLs =====
app.frontend.url=http://localhost:5173
app.backend.url=http://localhost:8080

# ===== CORS =====
cors.allowed-origins=http://localhost:5173
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ===== RECORDATORIOS Y JOBS DESHABILITADOS =====
app.reservas.reminder.enabled=false
app.timezone=America/Montevideo

# ===== ACTUATOR (necesario para health-check del orquestador) =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===== LOGGING =====
logging.level.com.utec.backend=INFO
logging.level.org.springframework.security=WARN
logging.level.liquibase=INFO

# SpringDoc desactivado en e2e (no se prueba la docs)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
