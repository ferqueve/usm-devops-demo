# ===== CONFIGURACIÓN PRINCIPAL =====
# Archivo base con configuración común

# Importar variables de entorno desde el archivo .env de backend
spring.config.import=optional:file:.env[.properties]

# Perfil activo por defecto
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Nombre de la aplicación
spring.application.name=utec-space-manager-backend

# Configuración del servidor
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# Configuración de archivos multipart (para subida de imágenes de alta calidad)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# ===== BASE DE DATOS =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/utec_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ut_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — tolerar wake-ups lentos (PG dormido en Railway serverless).
spring.datasource.hikari.initialization-fail-timeout=${HIKARI_INIT_FAIL_TIMEOUT:120000}
spring.datasource.hikari.connection-timeout=${HIKARI_CONN_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=${HIKARI_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE:300000}

# JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# ===== JWT =====
jwt.secret=${JWT_SECRET:}
# 1 hour default
jwt.expiration=${JWT_EXPIRATION:3600000}
# 24 hours default
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}

# ===== EMAIL - GMAIL API =====
# Gmail API Configuration
# Enable/disable Gmail API (set to false to disable email functionality)
gmail.api.enabled=${GMAIL_API_ENABLED:false}
gmail.api.client-id=${GMAIL_CLIENT_ID:}
gmail.api.client-secret=${GMAIL_CLIENT_SECRET:}
gmail.api.refresh-token=${GMAIL_REFRESH_TOKEN:}
gmail.api.from-email=${GMAIL_FROM_EMAIL:usm.utec.uy@gmail.com}


# ===== FRONTEND =====
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===== BACKEND =====
app.backend.url=${BACKEND_URL:http://localhost:8080}

# ===== RESERVAS - RECORDATORIOS =====
# Horas antes de la reserva para enviar recordatorio (por defecto 24 horas)
app.reservas.reminder.hours-before=${RESERVAS_REMINDER_HOURS_BEFORE:24}
# Habilitar/deshabilitar recordatorios automáticos
app.reservas.reminder.enabled=${RESERVAS_REMINDER_ENABLED:true}

# ===== ZONA HORARIA =====
# Zona horaria para mostrar fechas a usuarios en emails y reportes
# Para Uruguay usar: America/Montevideo
app.timezone=${APP_TIMEZONE:America/Montevideo}

# ===== ML SERVICE (Python) =====
# URL del servicio Python ml-svc (Forecasting con Prophet).
# Local: http://localhost:8000  ·  Railway: inyectar la URL del servicio interno.
app.ml-service-url=${ML_SERVICE_URL:http://localhost:8000}

# ===== AI SERVICE (Python) =====
# URL del servicio Python ai-svc (capa de IA generativa: Gemini + LangChain).
# Local: http://localhost:8001  ·  Railway: ai-svc.railway.internal:8001
app.ai-service-url=${AI_SERVICE_URL:http://localhost:8001}

# ===== OAUTH2 - GOOGLE =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_URL:http://localhost:8080}/api/v1/oauth2/google/callback

# ===== LOGGING =====
# Configuración base (se sobrescribe por perfil)
logging.level.com.utec.backend=INFO

# Configurar logfile
logging.file.name=logs/application.log
logging.file.path=logs

# ===== ACTUATOR =====
# Monitoreo del sistema para todos los ambientes
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Habilitar endpoints adicionales
management.endpoint.info.access=unrestricted
management.endpoint.logfile.access=unrestricted
management.endpoint.liquibase.access=unrestricted

# Info endpoint - información de la aplicación
management.info.env.enabled=true
info.app.name=UTEC Space Manager
info.app.description=Sistema de Gesti\u00F3n de Espacios UTEC
info.app.version=1.0.0
info.app.java.version=${java.version}
info.app.environment=${spring.profiles.active}

# HTTP Exchanges (reemplaza httptrace desde Spring Boot 2.2+)
management.httpexchanges.recording.enabled=true

# ===== SPRINGDOC OPENAPI =====
# Documentación API con descripciones
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ===== MINIO - OBJECT STORAGE =====
# MinIO Configuration for image storage
# Enable/disable MinIO (set to false to disable file storage functionality)
minio.enabled=${MINIO_ENABLED:false}
# Endpoint interno para conexión desde el backend
minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
# URL pública para acceso desde el navegador (debe ser accesible desde el cliente)
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.access-key=${MINIO_ROOT_USER:minioadmin}
minio.secret-key=${MINIO_ROOT_PASSWORD:minioadmin}
minio.bucket-name=${MINIO_BUCKET_NAME:espacios}
minio.region=${MINIO_REGION:us-east-1}
# Maximum file size in bytes (50MB default para imágenes de alta calidad)
minio.max-file-size=${MINIO_MAX_FILE_SIZE:52428800}
# Allowed MIME types (comma-separated)
minio.allowed-mime-types=${MINIO_ALLOWED_MIME_TYPES:image/jpeg,image/jpg,image/png,image/webp,image/gif}

# ===== REDIS =====
# Redis Configuration
# Por defecto localhost para desarrollo local, cambiar a 'redis' cuando se use Docker
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ===== CACHE CONFIGURATION =====
# Habilitar cache
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
# TTLs específicos por cache (en milisegundos)
cache.usuarioStats.ttl=${CACHE_USUARIO_STATS_TTL:600000}
cache.inventarioStatistics.ttl=${CACHE_INVENTARIO_STATS_TTL:300000}
cache.espacios.ttl=${CACHE_ESPACIOS_TTL:900000}
cache.reservas.ttl=${CACHE_RESERVAS_TTL:120000}

