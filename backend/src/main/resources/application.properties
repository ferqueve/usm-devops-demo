# ===== CONFIGURACIÓN PRINCIPAL =====
# Archivo base con configuración común

# Importar variables de entorno desde el archivo .env de backend
spring.config.import=optional:file:.env[.properties]

# Perfil activo por defecto
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Nombre de la aplicación
spring.application.name=utec-space-manager-backend

# Configuración del servidor
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# ===== BASE DE DATOS =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/utec_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ut_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# ===== JWT =====
jwt.secret=${JWT_SECRET:}
# 1 hour default
jwt.expiration=${JWT_EXPIRATION:3600000}
# 24 hours default
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}

# ===== EMAIL - GMAIL API =====
# Gmail API Configuration
gmail.api.client-id=${GMAIL_CLIENT_ID:}
gmail.api.client-secret=${GMAIL_CLIENT_SECRET:}
gmail.api.refresh-token=${GMAIL_REFRESH_TOKEN:}
gmail.api.from-email=${GMAIL_FROM_EMAIL:usm.utec.uy@gmail.com}


# ===== FRONTEND =====
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===== BACKEND =====
app.backend.url=${BACKEND_URL:http://localhost:8080}

# ===== RESERVAS - RECORDATORIOS =====
# Horas antes de la reserva para enviar recordatorio (por defecto 24 horas)
app.reservas.reminder.hours-before=${RESERVAS_REMINDER_HOURS_BEFORE:24}
# Habilitar/deshabilitar recordatorios automáticos
app.reservas.reminder.enabled=${RESERVAS_REMINDER_ENABLED:true}

# ===== OAUTH2 - GOOGLE =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${BACKEND_URL:http://localhost:8080}/api/v1/oauth2/google/callback

# ===== LOGGING =====
# Configuración base (se sobrescribe por perfil)
logging.level.com.utec.backend=INFO

# Configurar logfile
logging.file.name=logs/application.log
logging.file.path=logs

# ===== ACTUATOR =====
# Monitoreo del sistema para todos los ambientes
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Habilitar endpoints adicionales
management.endpoint.info.access=unrestricted
management.endpoint.logfile.access=unrestricted
management.endpoint.liquibase.access=unrestricted

# Info endpoint - información de la aplicación
management.info.env.enabled=true
info.app.name=UTEC Space Manager
info.app.description=Sistema de Gestión de Espacios UTEC
info.app.version=1.0.0
info.app.java.version=${java.version}
info.app.environment=${spring.profiles.active}

# HTTP Exchanges (reemplaza httptrace desde Spring Boot 2.2+)
management.httpexchanges.recording.enabled=true

# ===== SPRINGDOC OPENAPI =====
# Documentación API con descripciones
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

