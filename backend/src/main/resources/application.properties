# ===== CONFIGURACIÓN PRINCIPAL =====
# Archivo base con configuración común

# Importar variables de entorno desde el archivo .env en el directorio padre
spring.config.import=optional:file:../.env[.properties]

# Perfil activo por defecto
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Nombre de la aplicación
spring.application.name=utec-space-manager-backend

# Configuración del servidor
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# ===== BASE DE DATOS =====
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/utec_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ut_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# ===== JWT =====
jwt.secret=${JWT_SECRET:}
# 1 hour default
jwt.expiration=${JWT_EXPIRATION:3600000}
# 24 hours default
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:86400000}

# ===== EMAIL =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# ===== FRONTEND =====
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===== LOGGING =====
logging.level.com.utec.backend=INFO

