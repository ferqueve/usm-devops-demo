# ===== CONFIGURACIÓN DE PRODUCCIÓN =====

# ===== LOGGING =====
# Logging limitado para producción
logging.level.com.utec.backend=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# ===== JPA =====
# Configuración JPA para producción
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== ACTUATOR =====
# Actuator limitado para producción
management.endpoints.web.exposure.include=health,info

# ===== CORS =====
# CORS restringido (obligatorio definir en producción)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type}
cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

