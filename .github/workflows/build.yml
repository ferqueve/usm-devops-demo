name: Build

on:
  push:
    branches:
      - dev

jobs:
  analyze:
    name: Build and analyze (USM)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build backend (Maven verify + JaCoCo)
        run: mvn -B verify -f backend/pom.xml -Dmaven.test.failure.ignore=true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage
        continue-on-error: true

      # Despierta Sonar (serverless en Railway) antes del scan.
      # Si reporta DB_MIGRATION_NEEDED, dispara la migración automáticamente.
      - name: Wake SonarQube and wait for UP
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -e
          deadline=$(( $(date +%s) + 360 ))
          migration_triggered=0
          while [ $(date +%s) -lt $deadline ]; do
            body=$(curl -sS "$SONAR_HOST_URL/api/system/status" || true)
            echo "body=$body"
            if echo "$body" | grep -q '"status":"UP"'; then
              echo "SonarQube listo."
              exit 0
            fi
            if echo "$body" | grep -q '"status":"DB_MIGRATION_NEEDED"' && [ $migration_triggered -eq 0 ]; then
              echo "Disparando migración de DB..."
              curl -sS -X POST "$SONAR_HOST_URL/api/system/migrate_db" || true
              migration_triggered=1
            fi
            sleep 10
          done
          echo "Timeout esperando a SonarQube (>6 min)."
          exit 1

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
