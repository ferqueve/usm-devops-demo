name: Deploy to Railway

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Dos pushes seguidos a main ya no se pisan: el segundo espera al primero.
# No se cancela en curso, porque abortar a mitad de deploy deja servicios
# desparejos entre sí.
concurrency:
  group: deploy-produccion
  cancel-in-progress: false

# ci.yml se invoca como workflow reutilizable y uno de sus jobs pide
# pull-requests: read. Un workflow llamado no puede pedir mas permisos que el
# que lo llama, asi que hay que concederlos aca o la corrida falla al arrancar.
permissions:
  contents: read
  pull-requests: read

env:
  REGISTRY: ghcr.io
  # El namespace va en minúsculas: los nombres de imagen no admiten mayúsculas.
  NAMESPACE: mathiaspena

jobs:
  # Puerta: si la verificación falla, no se construye ni se despliega nada.
  verificar:
    uses: ./.github/workflows/ci.yml

  # Construye la imagen una sola vez y la publica. Lo que se despliega después
  # es exactamente este artefacto, no una reconstrucción desde el código.
  build:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: backend
            image: usm-utec-backend
            build_args: ""
          - dir: frontend
            image: usm-utec-frontend
            # Vite hornea estas variables en el bundle, así que tienen que
            # existir en el build. Antes las inyectaba Railway; ahora que la
            # imagen se construye acá, las provee el repositorio.
            build_args: |
              VITE_API_URL=${{ vars.VITE_API_URL }}
              VITE_FRONTEND_URL=${{ vars.VITE_FRONTEND_URL }}
          - dir: ml
            image: usm-utec-ml
            build_args: ""
          - dir: ai
            image: usm-utec-ai
            build_args: ""
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dos tags: el sha permite volver a una versión exacta, y latest es el que
      # Railway vuelve a bajar en cada despliegue.
      - name: Construir y publicar ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.dir }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build_args }}
          # Esta etiqueta es la que hace que GHCR asocie el paquete al
          # repositorio. Sin la asociacion, el GITHUB_TOKEN del workflow no
          # tiene permiso de escritura sobre el paquete.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.NAMESPACE }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [utec-backend, utec-frontend, ml-svc, ai-svc]
    steps:
      - name: Install Railway CLI
        run: npm i -g @railway/cli

      # --from-source vuelve a bajar la imagen de :latest en vez de reactivar el
      # despliegue anterior. Railway no construye nada: corre el artefacto ya
      # publicado y verificado.
      - name: Desplegar ${{ matrix.service }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service ${{ matrix.service }} --from-source --yes

  # Railway ya valida el healthcheck antes de mandar tráfico; esto deja la
  # confirmación escrita en el log de la corrida.
  verificar-despliegue:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # /actuator/health completo agrega ai-svc y ml-svc, que duermen por
      # inactividad: daria DOWN aunque el backend este perfecto. El grupo
      # `railway` incluye solo la app y la base, y es publico para la sonda.
      - name: Esperar a que el backend responda sano
        run: |
          set -u
          deadline=$(( $(date +%s) + 420 ))
          until [ $(date +%s) -ge $deadline ]; do
            estado=$(curl -sS --max-time 20 https://usm-bnd.up.railway.app/actuator/health/railway || true)
            echo "health=$estado"
            case "$estado" in
              *'"status":"UP"'*) echo "Backend sano."; exit 0 ;;
            esac
            sleep 15
          done
          echo "El backend no llegó a estado UP en 7 minutos."
          exit 1

      - name: Esperar a que el frontend responda
        run: |
          set -u
          deadline=$(( $(date +%s) + 300 ))
          until [ $(date +%s) -ge $deadline ]; do
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              https://usm-utec.up.railway.app/ || echo 000)
            echo "http=$codigo"
            if [ "$codigo" = "200" ]; then echo "Frontend sirviendo."; exit 0; fi
            sleep 10
          done
          echo "El frontend no respondió 200 en 5 minutos."
          exit 1
