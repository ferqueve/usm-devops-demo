name: E2E (Playwright)

# Manual a propósito. La suite extremo a extremo levanta Postgres, Redis, el
# backend y Vite, así que tarda varios minutos: no tiene sentido en cada push.
# Ejecutar desde la pestaña Actions, o antes de un release.
#
# Hasta ahora scripts/e2e.sh sólo se corría a mano en la máquina de desarrollo.

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Instalar navegadores de Playwright
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Correr la suite
        run: scripts/e2e.sh

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            .e2e-logs/
          retention-days: 7
