name: CI

# Verificación del código. Corre en cada PR y en cada push a dev, y la reutiliza
# deploy.yml como puerta previa al despliegue (workflow_call).
#
# Todo lo de acá adentro rompe el build si falla. No hay continue-on-error ni
# maven.test.failure.ignore: si un test se cae, la corrida es roja.

on:
  pull_request:
  push:
    branches: [dev]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Maven + JaCoCo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: zulu
          cache: maven

      - name: Verify
        run: mvn -B verify -f backend/pom.xml

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 5

  frontend:
    name: Frontend (lint + tipos + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Chequeo de tipos (incluye los tests)
        run: pnpm typecheck

      - name: Tests con cobertura
        run: pnpm test:coverage

      # Compila igual que Railway, para que un build roto se vea acá y no en el deploy.
      - name: Build de producción
        run: pnpm build
        env:
          VITE_API_URL: http://localhost:8080/api/v1

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: frontend/coverage/
          retention-days: 5

  seguridad:
    name: Fuga de secretos
    runs-on: ubuntu-latest
    # En eventos de pull_request, gitleaks lista los commits del PR por la API.
    # El GITHUB_TOKEN por defecto no trae ese permiso y el paso muere con
    # "Resource not accessible by integration" antes de escanear nada.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # El repo ya tenía .gitleaksignore configurado pero nadie lo ejecutaba.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: Servicios Python (ml + ai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Versión fija: con ruff suelto, una release nueva puede agregar reglas y
      # poner la CI en rojo sin que nadie haya tocado el código.
      - name: Instalar ruff
        run: pip install 'ruff==0.16.5'

      # La configuración vive en ruff.toml en la raíz del repo.
      - name: Lint
        run: ruff check ml ai

      # Chequeo de humo: estos dos servicios se desplegaban a producción sin
      # ninguna verificación previa.
      - name: Verificar que compile
        run: |
          python -m compileall -q ml
          python -m compileall -q ai
